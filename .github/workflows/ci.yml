name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Restore and audit dependencies
        run: dotnet restore MyProject.sln

      - name: Check formatting and analyzers
        run: dotnet format MyProject.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MyProject.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MyProject.sln --configuration Release --no-build

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
